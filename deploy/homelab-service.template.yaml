# Merge under `services:` in the existing stack. Replace placeholders outside Git.
  haier-control:
    image: haier-control:deployed
    container_name: haier-control
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "<LAN_BIND_ADDRESS>:<LAN_PORT>:8787"
    environment:
      HAIER_DRIVER: haier-cloud
      HAIER_LOG_LEVEL: INFO
      # Recommended opt-in automatic login. Remove these two entries to use pairing.
      HAIER_HON_EMAIL_FILE: /run/secrets/haier_hon_email
      HAIER_HON_PASSWORD_FILE: /run/secrets/haier_hon_password
      # Convenience alternative: HAIER_HON_EMAIL / HAIER_HON_PASSWORD. Direct
      # values are visible in Docker inspect and DockerHand; do not use both modes.
    volumes:
      - <RUNTIME_ROOT>/data:/data
      - <RUNTIME_ROOT>/secrets/master_key:/run/secrets/haier_control_master_key:ro
      - <RUNTIME_ROOT>/secrets/hon_email:/run/secrets/haier_hon_email:ro
      - <RUNTIME_ROOT>/secrets/hon_password:/run/secrets/haier_hon_password:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
