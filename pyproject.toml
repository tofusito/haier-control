[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "haier-control"
version = "0.1.0"
description = "Minimal local-first controller for Haier hOn air conditioners"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiosqlite>=0.20,<1",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
haier-control = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# tests/ has no __init__.py, so without these mypy sees each test file under two
# module names and refuses to check anything at all.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# Test doubles duck-type the real collaborators and reach into private attributes
# on purpose. Strict mode still applies to app/, which is what ships.
module = "tests.*"
disallow_untyped_defs = false
disable_error_code = ["arg-type", "method-assign", "no-any-return", "type-arg", "unused-ignore"]
